<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Switch OS Dashboard</title>
    
    <!-- Link to the Web App Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --switch-blue: #00c3e3;
            --switch-red: #ff4554;
            --switch-dark: #282828;
            --switch-light-gray: #e6e6e6;
            --switch-bezel: #111111;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .phone-device {
            width: 380px;
            height: 800px;
            background-color: var(--switch-dark);
            border-radius: 40px;
            border: 12px solid var(--switch-bezel);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 2px #333;
            overflow: hidden;
            max-height: 100vh;
            max-width: 100vw;
            box-sizing: border-box;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 25px;
            gap: 25px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .widget {
            background-color: #353535;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Top Useful Widget */
        .useful-widget { border-top: 5px solid var(--switch-blue); }
        .greeting-title { font-size: 1.4rem; font-weight: 900; color: #ffffff; margin-bottom: 5px; }
        .progress-text { font-size: 0.9rem; color: #aaaaaa; margin-bottom: 12px; font-weight: 700; }
        .progress-track { width: 100%; height: 10px; background-color: #222; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: var(--switch-blue); width: 0%; border-radius: 5px; transition: width 0.1s linear; }

        /* Date Section */
        .date-widget { border-left: 5px solid var(--switch-light-gray); }
        .day-name { font-size: 1.2rem; color: #aaaaaa; font-weight: 700; }
        .month-line { font-size: 1.8rem; font-weight: 900; color: #ffffff; display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        .month-number { background-color: var(--switch-light-gray); color: #000; font-size: 0.9rem; padding: 3px 10px; border-radius: 12px; font-weight: 900; }
        .year-line { font-size: 1.2rem; color: #888; }

        /* Time Section */
        .time-widget { background: transparent; box-shadow: none; padding: 5px 0; align-items: center; }
        .time-main { font-size: 3.8rem; font-weight: 900; letter-spacing: 2px; font-variant-numeric: tabular-nums; text-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: baseline; }
        .time-ms-container { font-size: 1.8rem; color: #aaaaaa; font-variant-numeric: tabular-nums; margin-top: -5px; font-weight: 700; }
        .colon { animation: blink 1s infinite; margin: 0 4px; }

        /* Countdown Section */
        .countdown-widget { border-right: 5px solid var(--switch-red); background-color: rgba(255, 69, 84, 0.1); }
        .countdown-title { font-size: 0.9rem; color: var(--switch-red); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 900; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .countdown-timer { font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; color: #ffffff; }

        /* Install Button */
        .install-btn {
            background-color: var(--switch-light-gray);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
            display: none; /* Hidden by default */
            transition: transform 0.1s;
        }
        .install-btn:active { transform: scale(0.95); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        @media (max-width: 450px), (max-height: 850px) {
            .phone-device { width: 100vw; height: 100vh; border-radius: 0; border: none; box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="phone-device">
        <div class="screen">
            
            <div class="widget useful-widget">
                <div class="greeting-title" id="greeting">Good Morning!</div>
                <div class="progress-text"><span id="progress-percent">0.00</span>% of the day has passed</div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>
            </div>

            <div class="widget date-widget">
                <div class="day-name" id="day">Loading...</div>
                <div class="month-line">
                    <span id="month">Month</span> 
                    <span class="month-number" id="month-num">0</span>
                </div>
                <div class="year-line">
                    <span id="date">00</span>, <span id="year">0000</span>
                </div>
            </div>

            <div class="widget time-widget">
                <div class="time-main">
                    <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span>
                </div>
                <div class="time-ms-container">
                    .<span id="milliseconds">000</span>
                </div>
            </div>

            <div class="widget countdown-widget">
                <div class="countdown-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--switch-red)"><path d="M12 2C12 2 12 6 15 6C18 6 18 2 18 2H12ZM6 2C6 2 6 6 9 6C12 6 12 2 12 2H6ZM2 10C2 11.1 2.9 12 4 12H20C21.1 12 22 11.1 22 10V8H2V10ZM2 14V20C2 21.1 2.9 22 4 22H20C21.1 22 22 21.1 22 20V14H2V14Z"/></svg>
                    Birthday (Nov 6)
                </div>
                <div class="countdown-timer" id="countdown">Calculating...</div>
            </div>

            <!-- The Install App Button -->
            <button id="install-button" class="install-btn">🎮 Install Web App</button>

        </div>
    </div>

    <script>
        // --- CLOCK AND CALENDAR LOGIC ---
        function updateDisplay() {
            const now = new Date();

            document.getElementById('hours').textContent = String(now.getHours()).padStart(2, '0');
            document.getElementById('minutes').textContent = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('seconds').textContent = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('milliseconds').textContent = String(now.getMilliseconds()).padStart(3, '0');

            const currentHour = now.getHours();
            let greetingText = "Good Evening!";
            if (currentHour >= 5 && currentHour < 12) greetingText = "Good Morning!";
            else if (currentHour >= 12 && currentHour < 18) greetingText = "Good Afternoon!";
            document.getElementById('greeting').textContent = greetingText;

            const totalSecondsInDay = 86400; 
            const secondsPassed = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds() + (now.getMilliseconds() / 1000);
            const percentComplete = ((secondsPassed / totalSecondsInDay) * 100).toFixed(3);
            
            document.getElementById('progress-percent').textContent = percentComplete;
            document.getElementById('progress-bar').style.width = percentComplete + '%';

            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            document.getElementById('day').textContent = days[now.getDay()];
            document.getElementById('month').textContent = months[now.getMonth()];
            document.getElementById('month-num').textContent = now.getMonth() + 1; 
            document.getElementById('date').textContent = now.getDate();
            document.getElementById('year').textContent = now.getFullYear();

            let currentYear = now.getFullYear();
            let birthday = new Date(currentYear, 10, 6, 0, 0, 0); 
            if (now.getTime() > birthday.getTime()) birthday.setFullYear(currentYear + 1);

            const diff = birthday.getTime() - now.getTime();
            const daysLeft = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            const hoursLeft = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            const minutesLeft = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const secondsLeft = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

            document.getElementById('countdown').textContent = `${daysLeft}d ${hoursLeft}h ${minutesLeft}m ${secondsLeft}s`;

            requestAnimationFrame(updateDisplay);
        }
        requestAnimationFrame(updateDisplay);

        // --- PROGRESSIVE WEB APP (PWA) LOGIC ---
        
        // 1. Register the Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.error('Service Worker registration failed: ', err));
            });
        }

        // 2. Handle the Install Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('install-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome from automatically showing the default prompt
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            // Show the install button
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt !== null) {
                // Show the browser's install prompt
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none'; // Hide button after choice
            }
        });

        window.addEventListener('appinstalled', () => {
            // App is installed, clean up
            installBtn.style.display = 'none';
            deferredPrompt = null;
            console.log('App was successfully installed!');
        });
    </script>
</body>
</html>
